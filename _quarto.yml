project:
  type: website
  output-dir: docs
  post-render: ./_post-render.sh
  render:
    - "**/*.qmd"

website:
  title: "Lisa May Ceramics"
  favicon: images/favicon.png
  navbar:
    left:
      - href: available.qmd
        text: Available
      - href: index.qmd
        text: Gallery
      - href: contact.qmd
        text: Contact
      - href: about.qmd
        text: About
      - href: thoughts.qmd
        text: Thoughts

  sidebar:
    - id: "thoughts-sidebar"
      title: "Thoughts"
      style: "docked"
      contents:
        - text: "All Thoughts"
          href: thoughts.qmd
        - auto: thoughts/*.qmd

  page-footer:
    left: "© 2026 Lisa May Ceramics. All rights reserved. Images may not be used without permission."
    center: "[Subscribe to my email newsletter!](contact.html)"

format:
  html:
    theme:
      - lux
      - brand
    css: styles.css
    toc: true
    include-in-header: _mailerlite.html